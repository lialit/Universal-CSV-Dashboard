name: Bug report
description: Report a reproducible problem in Universal CSV Dashboard
title: "[Bug]: "
labels:
  - bug
  - status: needs discussion
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Universal CSV Dashboard. Please search existing issues before submitting a new report.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Launch the app
        2. Upload a CSV file
        3. Open ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Dashboard and navigation
        - Data loading and validation
        - Charts and visualizations
        - Export
        - User interface
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application version
      description: Use the release tag or commit SHA when known.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, browser, and deployment type.
      placeholder: Windows 11, Python 3.11, Firefox 153, local installation
    validations:
      required: true

  - type: textarea
    id: dataset
    attributes:
      label: Dataset details
      description: Do not upload sensitive data. Describe file size, row count, column count, delimiters, and unusual values.
      placeholder: 80 MB CSV, 1.2M rows, 18 columns, comma delimiter
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, traceback, or screenshots
      description: Paste relevant output or drag screenshots here. Remove secrets and private data first.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed sensitive or private data from this report.
          required: true
        - label: I can reproduce this issue with the information provided above.
          required: true
