changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features and improvements
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Performance
      labels:
        - performance
    - title: Documentation
      labels:
        - documentation
        - "area: docs"
    - title: Testing and quality
      labels:
        - testing
    - title: Dependencies
      labels:
        - dependencies
    - title: Repository and release infrastructure
      labels:
        - "area: github"
        - github_actions
    - title: Internal refactoring
      labels:
        - refactor
    - title: Other changes
      labels:
        - "*"
