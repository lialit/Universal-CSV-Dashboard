name: Release preparation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
      create_draft:
        description: "Create a draft GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate VERSION, tag and changelog
        run: python scripts/validate_release.py --tag "${{ inputs.tag }}"

      - name: Confirm tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Create draft GitHub Release
        if: ${{ inputs.create_draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target main \
            --title "Universal CSV Dashboard $RELEASE_TAG" \
            --generate-notes \
            --draft
