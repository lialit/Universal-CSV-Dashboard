name: Release preparation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0 or v1.0.0-smoke.1"
        required: true
        type: string
      create_draft:
        description: "Create a draft GitHub Release"
        required: true
        default: false
        type: boolean
      smoke_test:
        description: "Allow only a v<VERSION>-smoke.N draft tag"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate workflow mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.smoke_test }}" == "true" && "${{ inputs.create_draft }}" != "true" ]]; then
            echo "Smoke-test mode must create a draft release." >&2
            exit 1
          fi
          if [[ "${{ inputs.smoke_test }}" != "true" && "${{ inputs.tag }}" == *-smoke.* ]]; then
            echo "Smoke tags require smoke_test = true." >&2
            exit 1
          fi

      - name: Validate VERSION, tag and changelog
        shell: bash
        run: |
          args=(--tag "${{ inputs.tag }}")
          if [[ "${{ inputs.smoke_test }}" == "true" ]]; then
            args+=(--allow-smoke-tag)
          fi
          python scripts/validate_release.py "${args[@]}"

      - name: Confirm tag does not already exist
        if: ${{ inputs.create_draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Create draft GitHub Release
        if: ${{ inputs.create_draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SMOKE_TEST: ${{ inputs.smoke_test }}
        run: |
          title="Universal CSV Dashboard $RELEASE_TAG"
          if [[ "$SMOKE_TEST" == "true" ]]; then
            title="[SMOKE TEST — DO NOT PUBLISH] $title"
          fi

          gh release create "$RELEASE_TAG" \
            --target main \
            --title "$title" \
            --generate-notes \
            --draft
