name: Project automation

on:
  issues:
    types: [opened, reopened, closed, transferred, labeled, unlabeled]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      item_url:
        description: "Issue or pull request URL to add and update"
        required: true
        type: string
      workflow_state:
        description: "Workflow state"
        required: true
        type: choice
        options:
          - Backlog
          - Ready
          - In progress
          - Review
          - Done

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-automation-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  PROJECT_OWNER: lialit
  PROJECT_NUMBER: "2"
  WORKFLOW_FIELD: Workflow
  EXPECTED_REPOSITORY: lialit/Universal-CSV-Dashboard

jobs:
  sync-project:
    name: Sync roadmap item
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      TARGET_URL: ${{ inputs.item_url || github.event.issue.html_url || github.event.pull_request.html_url }}
    steps:
      - name: Check out repository configuration
        uses: actions/checkout@v5

      - name: Validate project token and configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Repository secret PROJECT_TOKEN is missing." >&2
            exit 1
          fi
          gh auth status
          python scripts/validate_project_automation.py

      - name: Resolve target workflow state
        id: state
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            value="${{ inputs.workflow_state }}"
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            case "${{ github.event.action }}" in
              closed) value="Done" ;;
              labeled|unlabeled) value="" ;;
              *) value="Backlog" ;;
            esac
          else
            case "${{ github.event.action }}" in
              ready_for_review) value="Review" ;;
              closed) value="Done" ;;
              labeled|unlabeled) value="" ;;
              *) value="In progress" ;;
            esac
          fi

          echo "value=$value" >> "$GITHUB_OUTPUT"
          if [[ -n "$value" ]]; then
            echo "Target workflow state: $value"
          else
            echo "Workflow state is unchanged for this event."
          fi

      - name: Add item and synchronize Project fields
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_URL" =~ ^https://github.com/([^/]+)/([^/]+)/(issues|pull)/([0-9]+)$ ]]; then
            echo "Unsupported Issue or pull request URL: $TARGET_URL" >&2
            exit 1
          fi

          repo_owner="${BASH_REMATCH[1]}"
          repo_name="${BASH_REMATCH[2]}"
          item_number="${BASH_REMATCH[4]}"
          repository="$repo_owner/$repo_name"

          if [[ "$repository" != "$EXPECTED_REPOSITORY" ]]; then
            echo "URL must belong to $EXPECTED_REPOSITORY, received $repository." >&2
            exit 1
          fi

          project_query='query($login:String!,$number:Int!){user(login:$login){projectV2(number:$number){id fields(first:100){nodes{... on ProjectV2SingleSelectField{id name options{id name}}}} items(first:100){nodes{id content{... on Issue{url} ... on PullRequest{url}}}}}}}'
          project_json="$(gh api graphql -f query="$project_query" -F login="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")"

          project_id="$(jq -r '.data.user.projectV2.id // empty' <<< "$project_json")"
          item_id="$(jq -r --arg url "$TARGET_URL" '.data.user.projectV2.items.nodes[] | select(.content.url == $url) | .id' <<< "$project_json" | head -n 1)"

          if [[ -z "$project_id" ]]; then
            echo "Project #$PROJECT_NUMBER was not found for user $PROJECT_OWNER." >&2
            exit 1
          fi

          if [[ -z "$item_id" ]]; then
            content_query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issueOrPullRequest(number:$number){... on Issue{id url} ... on PullRequest{id url}}}}'
            content_json="$(gh api graphql -f query="$content_query" -F owner="$repo_owner" -F name="$repo_name" -F number="$item_number")"
            content_id="$(jq -r '.data.repository.issueOrPullRequest.id // empty' <<< "$content_json")"

            if [[ -z "$content_id" ]]; then
              echo "Could not resolve content node for $TARGET_URL." >&2
              exit 1
            fi

            add_mutation='mutation($project:ID!,$content:ID!){addProjectV2ItemById(input:{projectId:$project,contentId:$content}){item{id}}}'
            add_json="$(gh api graphql -f query="$add_mutation" -F project="$project_id" -F content="$content_id")"
            item_id="$(jq -r '.data.addProjectV2ItemById.item.id // empty' <<< "$add_json")"
            echo "Added item to project: $TARGET_URL"
          else
            echo "Item already exists in project: $TARGET_URL"
          fi

          if [[ -z "$item_id" ]]; then
            echo "Project item ID was not resolved." >&2
            exit 1
          fi

          update_mutation='mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){updateProjectV2ItemFieldValue(input:{projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}){projectV2Item{id}}}'

          set_field() {
            local field_name="$1"
            local option_name="$2"
            local field_id option_id

            field_id="$(jq -r --arg field "$field_name" '.data.user.projectV2.fields.nodes[] | select(.name == $field) | .id' <<< "$project_json")"
            option_id="$(jq -r --arg field "$field_name" --arg option "$option_name" '.data.user.projectV2.fields.nodes[] | select(.name == $field) | .options[] | select(.name == $option) | .id' <<< "$project_json")"

            if [[ -z "$field_id" || -z "$option_id" ]]; then
              echo "Could not resolve Project field '$field_name' option '$option_name'." >&2
              exit 1
            fi

            gh api graphql \
              -f query="$update_mutation" \
              -F project="$project_id" \
              -F item="$item_id" \
              -F field="$field_id" \
              -F option="$option_id" >/dev/null

            echo "Set $field_name to $option_name."
          }

          workflow_value="${{ steps.state.outputs.value }}"
          if [[ -n "$workflow_value" ]]; then
            set_field "$WORKFLOW_FIELD" "$workflow_value"
          fi

          labels_json="$(gh api "repos/$repository/issues/$item_number" --jq '[.labels[].name]')"
          mapping_file=".github/project-label-mapping.json"

          for field_name in Priority Release Area; do
            mapped_value="$(jq -r --arg field "$field_name" --argjson labels "$labels_json" '
              .[$field] as $mapping
              | [$labels[] | select($mapping[.] != null) | $mapping[.]]
              | first // empty
            ' "$mapping_file")"

            if [[ -n "$mapped_value" ]]; then
              set_field "$field_name" "$mapped_value"
            else
              echo "No mapped label found for $field_name; leaving the current value unchanged."
            fi
          done

          echo "Project synchronization completed for $TARGET_URL."
