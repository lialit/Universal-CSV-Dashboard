<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img"
     aria-labelledby="title desc">
  <title id="title">Universal CSV Dashboard</title>
  <desc id="desc">A CSV document transforming into an upward analytics chart.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <g transform="translate(12 12)">
    <rect x="8" y="2" width="116" height="132" rx="28" fill="url(#brand)"/>
    <path d="M35 38h62M35 57h42" fill="none" stroke="#fff"
          stroke-width="9" stroke-linecap="round" opacity=".88"/>
    <path d="M34 105 55 83 72 96 101 65" fill="none" stroke="#fff"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m89 65 12 0 0 12" fill="none" stroke="#fff"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="168" y="72" fill="#10213D" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="48" font-weight="750">Universal CSV</text>
  <text x="168" y="122" fill="#2563EB" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="48" font-weight="750">Dashboard</text>
</svg>
